<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Chubby Quokka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: a meadow-green page; the character stands on pale paper cards, facts beside it, poses in an even grid below. */
  :root {
    --bg: #EAF3DC;
    --fg: #3F2C1E;
    --muted: #6B5A48;
    --paper: #FFFBF2;
    --line: #CFDDB8;
    --accent: #4E9A2E;
    --display: 'Jua', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --body: 'Gowun Dodum', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1C2619; --fg: #F1E8D8; --muted: #B9AD98; --paper: #F3E9D6; --line: #34442D; --accent: #8FD05E; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1C2619; --fg: #F1E8D8; --muted: #B9AD98; --paper: #F3E9D6; --line: #34442D; --accent: #8FD05E; color-scheme: dark; }

  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; }
  .wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 48px;
          padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
          display: flex; flex-direction: column; gap: 28px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 9vw, 56px); line-height: 1.1; margin: 0; text-wrap: balance; }
  h1 small { display: block; font-size: 0.4em; color: var(--accent); margin-top: 6px; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; }
  .lead { margin: 8px 0 0; color: var(--muted); }
  .hero { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: center; }
  .stage { background: var(--paper); border-radius: 24px; }
  .stage svg { display: block; width: 100%; height: auto; }
  .defs { position: absolute; width: 0; height: 0; }
  dl { margin: 0; display: grid; grid-template-columns: 5em minmax(0, 1fr); gap: 10px 12px; }
  dt { font-family: var(--display); color: var(--accent); }
  dd { margin: 0; }
  .pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; margin-top: 20px; }
  .pal div { font-size: 12px; line-height: 1.35; color: var(--muted); }
  .pal i { display: block; height: 36px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 4px; }
  .pal b { display: block; color: var(--fg); font-weight: 400; }
  .section { display: flex; flex-direction: column; gap: 14px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  figure { margin: 0; }
  figcaption { font-family: var(--display); text-align: center; margin-top: 6px; }
  @media (max-width: 760px) {
    .hero { grid-template-columns: minmax(0, 1fr); }
    .hero .stage { max-width: 320px; width: 100%; margin: 0 auto; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>

</head>
<body>
<svg class="defs" aria-hidden="true">
  <defs>
    <radialGradient id="gFur" gradientUnits="userSpaceOnUse" cx="235" cy="175" r="430">
      <stop offset="0" stop-color="#F0C792"/><stop offset=".5" stop-color="#C8955F"/><stop offset="1" stop-color="#93613C"/>
    </radialGradient>
    <radialGradient id="gSweat" gradientUnits="userSpaceOnUse" cx="250" cy="410" r="270">
      <stop offset="0" stop-color="#FFF9EA"/><stop offset="1" stop-color="#E2D0AD"/>
    </radialGradient>
    <linearGradient id="gSleeve" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF7E6"/><stop offset="1" stop-color="#DCC9A4"/>
    </linearGradient>
    <radialGradient id="gMuzzle" cx=".4" cy=".3" r=".8">
      <stop offset="0" stop-color="#FFF5E0"/><stop offset="1" stop-color="#EBD2A8"/>
    </radialGradient>
    <radialGradient id="gBlush">
      <stop offset="0" stop-color="#F7837F" stop-opacity=".85"/><stop offset=".6" stop-color="#F7918A" stop-opacity=".45"/><stop offset="1" stop-color="#F7918A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gBeanie" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9BD56B"/><stop offset="1" stop-color="#4C962D"/>
    </linearGradient>
    <radialGradient id="gDark" cx=".35" cy=".3" r=".8">
      <stop offset="0" stop-color="#A9764D"/><stop offset="1" stop-color="#76502F"/>
    </radialGradient>
    <filter id="fFur" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="2" seed="3" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="11" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fSoft" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="8" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="fBlur" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="9"/></filter>
    <clipPath id="cSweat"><rect x="0" y="0" width="600" height="568"/></clipPath>
  </defs>
</svg>

<div class="wrap">
  <header>
    <h1>Chubby Quokka <small>쿼카뚱 캐릭터 시트</small></h1>
    <p class="lead">늘 웃는 얼굴의 통통한 쿼카. 먹을 것 앞에서 제일 솔직해요.</p>
  </header>

  <section class="hero">
    <div class="stage" id="hero"></div>
    <div>
      <dl>
        <dt>생김새</dt><dd>공처럼 둥근 몸, 짧은 팔다리, 진한 분홍 볼, 큰 코, 복슬복슬한 갈색 털</dd>
        <dt>옷</dt><dd>초록 비니와 크림색 맨투맨. 모든 장면에서 같은 옷을 입습니다.</dd>
        <dt>상징물</dt><dd>초록 잎사귀. 손에 들거나 가슴에 자수로 붙입니다.</dd>
        <dt>성격</dt><dd>먹는 걸 좋아하고 잘 웃지만, 잘 삐지기도 해요.</dd>
        <dt>말버릇</dt><dd>"한 입만", "뚱 아니고 통통"</dd>
        <dt>그리는 법</dt><dd>외곽선 없이 명암으로 표현하는 인형 같은 3D 느낌. 머리가 몸보다 큽니다.</dd>
      </dl>
      <div class="pal" id="pal"></div>
    </div>
  </section>

  <section class="section">
    <h2>표정·동작 10종</h2>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const C = { o:'#4A3020', nose:'#33241E', mouth:'#8C3434', tongue:'#F28C8C', tear:'#7CC7F2', leaf:'#7CC04B', leafD:'#3F8A26' };
const S = `stroke="${C.o}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"`;
const L = `fill="none" ${S}`;

function eye(type, x) {
  switch (type) {
    case 'happy': return `<path d="M${x-22},222 Q${x},190 ${x+22},222" ${L}/>`;
    case 'half':  return `<path d="M${x-20},210 A20,20 0 0 0 ${x+20},210 Z" fill="${C.nose}"/><path d="M${x-25},210 L${x+25},210" ${L}/>`;
    case 'big':   return `<circle cx="${x}" cy="213" r="25" fill="#fff" ${S}/><circle cx="${x}" cy="213" r="9" fill="${C.nose}"/>`;
    case 'cry':   return `<path d="M${x-22},208 Q${x},232 ${x+22},208" ${L}/>
                   <path d="M${x},240 C${x-17},266 ${x-11},284 ${x},284 C${x+11},284 ${x+17},266 ${x},240 Z" fill="${C.tear}" stroke="#4FA3D6" stroke-width="3" stroke-linejoin="round"/>`;
    case 'heart': return `<path transform="translate(${x},218) scale(1.35)" d="M0,16 C-32,-6 -17,-30 0,-12 C17,-30 32,-6 0,16Z" fill="#F0566E"/>`;
    default:      return `<circle cx="${x}" cy="215" r="20" fill="${C.nose}"/><circle cx="${x-6}" cy="208" r="7" fill="#fff"/><circle cx="${x+7}" cy="223" r="3.5" fill="#fff" opacity=".8"/>`;
  }
}

function mouth(type) {
  const line = `<path d="M300,264 L300,280" ${L}/>`;
  switch (type) {
    case 'open': return line + `<path d="M262,283 Q300,350 338,283 Z" fill="${C.mouth}" ${S}/><ellipse cx="300" cy="316" rx="17" ry="11" fill="${C.tongue}"/>`;
    case 'pout': return line + `<path d="M285,293 Q300,281 315,293" ${L}/>`;
    case 'o':    return `<ellipse cx="300" cy="296" rx="13" ry="17" fill="${C.mouth}" ${S}/>`;
    case 'wail': return line + `<path d="M268,312 Q300,268 332,312 Q300,326 268,312 Z" fill="${C.mouth}" ${S}/>`;
    case 'zig':  return line + `<path d="M270,294 L285,284 L300,294 L315,284 L330,294" ${L}/>`;
    case 'chew': return line + `<path d="M284,283 Q300,297 316,283" ${L}/>`;
    default:     return line + `<path d="M258,280 Q279,306 300,281 Q321,306 342,280" ${L}/>`;
  }
}

function brows(type) {
  if (type === 'angry') return `<path d="M186,172 L242,192" ${L}/><path d="M414,172 L358,192" ${L}/>`;
  if (type === 'flat')  return `<path d="M190,180 L240,184" ${L}/><path d="M410,180 L360,184" ${L}/>`;
  if (type === 'sad')   return `<path d="M190,190 L238,176" ${L}/><path d="M410,190 L362,176" ${L}/>`;
  return '';
}

function arm(side, pose) {
  const sx = side < 0 ? 150 : 450;
  const ang = { down: 15, up: 140, hold: -58 }[pose] * (side < 0 ? 1 : -1);
  return `<g transform="translate(${sx},420) rotate(${ang})">
    <circle cx="0" cy="128" r="22" fill="url(#gDark)" filter="url(#fFur)"/>
    <ellipse cx="0" cy="52" rx="42" ry="66" fill="url(#gSleeve)" filter="url(#fSoft)"/>
    <ellipse cx="0" cy="110" rx="31" ry="11" fill="#D3C09B"/>
  </g>`;
}

function leaf(bitten) {
  return `<g transform="translate(0,35)">
    <path d="M300,500 L300,462" fill="none" stroke="${C.leafD}" stroke-width="8" stroke-linecap="round"/>
    <path d="M300,470 C258,455 258,400 300,372 C342,400 342,455 300,470Z" fill="${C.leaf}"/>
    <path d="M300,470 C320,455 330,420 300,372 C342,400 342,455 300,470Z" fill="${C.leafD}" opacity=".35"/>
    <path d="M300,462 L300,392 M300,440 L282,426 M300,440 L318,426 M300,418 L286,406 M300,418 L314,406" fill="none" stroke="${C.leafD}" stroke-width="4" stroke-linecap="round"/>
    ${bitten ? `<circle cx="333" cy="394" r="18" fill="#F4E9D2"/>` : ''}
  </g>`;
}

function extras(type) {
  const heart = (x, y, s) => `<path transform="translate(${x},${y}) scale(${s})" d="M0,16 C-32,-6 -17,-30 0,-12 C17,-30 32,-6 0,16Z" fill="#F0566E"/>`;
  switch (type) {
    case 'hearts': return heart(545, 110, 1.1) + heart(572, 190, 0.6) + heart(48, 140, 0.8);
    case 'anger':  return `<g transform="translate(530,80)" stroke="#E5484D" stroke-width="8" fill="none" stroke-linecap="round">
        <path d="M-20,-7 Q-7,-7 -7,-20"/><path d="M7,-20 Q7,-7 20,-7"/><path d="M20,7 Q7,7 7,20"/><path d="M-7,20 Q-7,7 -20,7"/></g>`;
    case 'shock':  return `<g ${L}><path d="M68,84 L44,58"/><path d="M50,148 L16,138"/><path d="M532,84 L556,58"/><path d="M550,148 L584,138"/></g>`;
    case 'steam':  return `<g fill="#fff" stroke="${C.o}" stroke-width="4"><circle cx="522" cy="360" r="13"/><circle cx="548" cy="342" r="9"/><circle cx="566" cy="328" r="5"/></g>`;
    default: return '';
  }
}

function quokka(p) {
  const hold = p.arms === 'hold';
  const armsSvg = arm(-1, p.arms) + arm(1, p.arms);
  const ribs = Array.from({ length: 18 }, (_, i) => `<path d="M${140 + i * 19},156 L${140 + i * 19},192"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" role="img" aria-label="Chubby Quokka ${p.name}">
  <ellipse cx="300" cy="652" rx="185" ry="16" fill="#3A2A1A" opacity=".22" filter="url(#fBlur)"/>
  <ellipse cx="472" cy="600" rx="44" ry="18" transform="rotate(-25 472 600)" fill="url(#gDark)" filter="url(#fFur)"/>
  <ellipse cx="300" cy="505" rx="168" ry="138" fill="url(#gFur)" filter="url(#fFur)"/>
  <ellipse cx="238" cy="634" rx="48" ry="21" fill="url(#gDark)" filter="url(#fFur)"/>
  <ellipse cx="362" cy="634" rx="48" ry="21" fill="url(#gDark)" filter="url(#fFur)"/>
  <g clip-path="url(#cSweat)"><ellipse cx="300" cy="498" rx="178" ry="146" fill="url(#gSweat)"/></g>
  <path d="M148,565 Q300,604 452,565" fill="none" stroke="#D3C09B" stroke-width="18" stroke-linecap="round"/>
  ${hold ? '' : `<g transform="translate(300,505) rotate(20) scale(.42) translate(-300,-421)"><path d="M300,470 C258,455 258,400 300,372 C342,400 342,455 300,470Z" fill="${C.leaf}"/><path d="M300,500 L300,392" fill="none" stroke="${C.leafD}" stroke-width="8" stroke-linecap="round"/></g>`}
  <ellipse cx="300" cy="430" rx="150" ry="20" fill="#6B4A30" opacity=".3" filter="url(#fBlur)"/>
  ${hold ? '' : armsSvg}
  <circle cx="126" cy="124" r="42" fill="url(#gFur)" filter="url(#fFur)"/><circle cx="124" cy="126" r="23" fill="#D98F7C"/>
  <circle cx="474" cy="124" r="42" fill="url(#gFur)" filter="url(#fFur)"/><circle cx="476" cy="126" r="23" fill="#D98F7C"/>
  <ellipse cx="300" cy="250" rx="190" ry="165" fill="url(#gFur)" filter="url(#fFur)"/>
  <path d="M132,174 C132,40 468,40 468,174 Z" fill="url(#gBeanie)" filter="url(#fSoft)"/>
  <rect x="124" y="150" width="352" height="48" rx="24" fill="#5CA63A" filter="url(#fSoft)"/>
  <g stroke="#3F8A26" stroke-width="4" stroke-linecap="round" opacity=".55">${ribs}</g>
  <circle cx="300" cy="62" r="32" fill="#FFF5E0" filter="url(#fFur)"/>
  <ellipse cx="300" cy="313" rx="96" ry="66" fill="url(#gMuzzle)"/>
  <circle cx="146" cy="312" r="50" fill="url(#gBlush)"/>
  <circle cx="454" cy="312" r="50" fill="url(#gBlush)"/>
  <g transform="translate(0,35)">
    ${brows(p.brows)}${eye(p.eyes, 205)}${eye(p.eyes, 395)}
    ${mouth(p.mouth)}
    <ellipse cx="300" cy="243" rx="33" ry="22" fill="${C.nose}"/><ellipse cx="289" cy="235" rx="10" ry="5" fill="#fff" opacity=".6"/>
  </g>
  ${hold ? leaf(p.bitten) + armsSvg : ''}
  ${extras(p.extra)}
</svg>`;
}

const POSES = [
  { name:'기본',   eyes:'dot',   mouth:'smile', arms:'down' },
  { name:'말하기', eyes:'dot',   mouth:'open',  arms:'down' },
  { name:'활짝',   eyes:'happy', mouth:'open',  arms:'up' },
  { name:'잎사귀', eyes:'happy', mouth:'open',  arms:'hold' },
  { name:'냠냠',   eyes:'happy', mouth:'chew',  arms:'hold', bitten:true },
  { name:'하트',   eyes:'heart', mouth:'smile', arms:'down', extra:'hearts' },
  { name:'삐짐',   eyes:'half',  mouth:'pout',  arms:'down', brows:'flat', extra:'steam' },
  { name:'화남',   eyes:'dot',   mouth:'zig',   arms:'down', brows:'angry', extra:'anger' },
  { name:'깜짝',   eyes:'big',   mouth:'o',     arms:'up',   extra:'shock' },
  { name:'엉엉',   eyes:'cry',   mouth:'wail',  arms:'down', brows:'sad' },
];

const PAL = [['털 밝은 곳', '#F0C792'], ['털', '#C8955F'], ['털 어두운 곳', '#93613C'], ['주둥이', '#FFF5E0'], ['볼', '#F7837F'], ['코·눈', '#33241E'], ['비니', '#5CA63A'], ['맨투맨', '#FFF9EA']];

document.getElementById('hero').innerHTML = quokka(POSES[3]);
document.getElementById('pal').innerHTML = PAL.map(([n, c]) => `<div><i style="background:${c}"></i><b>${n}</b>${c}</div>`).join('');
document.getElementById('grid').innerHTML = POSES.map(p => `<figure><div class="stage">${quokka(p)}</div><figcaption>${p.name}</figcaption></figure>`).join('');
</script>
</body>
</html>
