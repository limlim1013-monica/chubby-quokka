<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Chubby Quokka</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
  /* Layout: a meadow-green page; the character stands on pale paper cards, facts beside it, poses in an even grid below. */
  :root {
    --bg: #EAF3DC;
    --fg: #3F2C1E;
    --muted: #6B5A48;
    --paper: #FFFBF2;
    --line: #CFDDB8;
    --accent: #4E9A2E;
    --display: 'Jua', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --body: 'Gowun Dodum', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #1C2619; --fg: #F1E8D8; --muted: #B9AD98; --paper: #F3E9D6; --line: #34442D; --accent: #8FD05E; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #1C2619; --fg: #F1E8D8; --muted: #B9AD98; --paper: #F3E9D6; --line: #34442D; --accent: #8FD05E; color-scheme: dark; }

  body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.6; }
  .wrap { max-width: 1040px; margin: 0 auto; padding-block: 28px 48px;
          padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
          display: flex; flex-direction: column; gap: 28px; }
  h1 { font-family: var(--display); font-weight: 400; font-size: clamp(36px, 9vw, 56px); line-height: 1.1; margin: 0; text-wrap: balance; }
  h1 small { display: block; font-size: 0.4em; color: var(--accent); margin-top: 6px; }
  h2 { font-family: var(--display); font-weight: 400; font-size: 24px; margin: 0; }
  .lead { margin: 8px 0 0; color: var(--muted); }
  .hero { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 28px; align-items: center; }
  .stage { background: var(--paper); border-radius: 24px; }
  .stage svg { display: block; width: 100%; height: auto; }
  dl { margin: 0; display: grid; grid-template-columns: 5em minmax(0, 1fr); gap: 10px 12px; }
  dt { font-family: var(--display); color: var(--accent); }
  dd { margin: 0; }
  .pal { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; margin-top: 20px; }
  .pal div { font-size: 12px; line-height: 1.35; color: var(--muted); }
  .pal i { display: block; height: 36px; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 4px; }
  .pal b { display: block; color: var(--fg); font-weight: 400; }
  .section { display: flex; flex-direction: column; gap: 14px; }
  .grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
  figure { margin: 0; }
  figcaption { font-family: var(--display); text-align: center; margin-top: 6px; }
  @media (max-width: 760px) {
    .hero { grid-template-columns: minmax(0, 1fr); }
    .hero .stage { max-width: 320px; width: 100%; margin: 0 auto; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Chubby Quokka <small>쿼카뚱 캐릭터 시트</small></h1>
    <p class="lead">늘 웃는 얼굴의 통통한 쿼카. 먹을 것 앞에서 제일 솔직해요.</p>
  </header>

  <section class="hero">
    <div class="stage" id="hero"></div>
    <div>
      <dl>
        <dt>생김새</dt><dd>동그란 얼굴과 귀, 크림색 배와 주둥이, 큰 코, 짧은 꼬리</dd>
        <dt>상징물</dt><dd>초록 잎사귀. 손에 들거나 먹는 장면에 씁니다.</dd>
        <dt>성격</dt><dd>먹는 걸 좋아하고 잘 웃지만, 잘 삐지기도 해요.</dd>
        <dt>말버릇</dt><dd>"한 입만", "뚱 아니고 통통"</dd>
        <dt>그리는 법</dt><dd>굵은 갈색 외곽선에 단색 채색. 머리와 몸 비율은 1 : 1</dd>
      </dl>
      <div class="pal" id="pal"></div>
    </div>
  </section>

  <section class="section">
    <h2>표정·동작 10종</h2>
    <div class="grid" id="grid"></div>
  </section>
</div>

<script>
const C = { o:'#5B3B28', fur:'#C8955F', furD:'#A9754B', cream:'#F7E4C4', nose:'#3B2A24', pink:'#F4A39A',
            ear:'#E3A48E', leaf:'#7CC04B', leafD:'#4E9A2E', mouth:'#8C3434', tongue:'#F28C8C', tear:'#7CC7F2', paw:'#5E4336' };
const S = `stroke="${C.o}" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"`;
const L = `fill="none" ${S}`;

function eye(type, x) {
  switch (type) {
    case 'happy': return `<path d="M${x-22},222 Q${x},190 ${x+22},222" ${L}/>`;
    case 'half':  return `<path d="M${x-20},210 A20,20 0 0 0 ${x+20},210 Z" fill="${C.nose}"/><path d="M${x-25},210 L${x+25},210" ${L}/>`;
    case 'big':   return `<circle cx="${x}" cy="213" r="25" fill="#fff" ${S}/><circle cx="${x}" cy="213" r="9" fill="${C.nose}"/>`;
    case 'cry':   return `<path d="M${x-22},208 Q${x},232 ${x+22},208" ${L}/>
                   <path d="M${x},240 C${x-17},266 ${x-11},284 ${x},284 C${x+11},284 ${x+17},266 ${x},240 Z" fill="${C.tear}" stroke="#4FA3D6" stroke-width="4" stroke-linejoin="round"/>`;
    case 'heart': return `<path transform="translate(${x},218) scale(1.35)" d="M0,16 C-32,-6 -17,-30 0,-12 C17,-30 32,-6 0,16Z" fill="#F0566E" stroke="${C.o}" stroke-width="4" stroke-linejoin="round"/>`;
    default:      return `<circle cx="${x}" cy="215" r="19" fill="${C.nose}"/><circle cx="${x-6}" cy="208" r="6.5" fill="#fff"/><circle cx="${x+6}" cy="222" r="3" fill="#fff" opacity=".8"/>`;
  }
}

function mouth(type) {
  const line = `<path d="M300,264 L300,280" ${L}/>`;
  switch (type) {
    case 'open': return line + `<path d="M262,283 Q300,350 338,283 Z" fill="${C.mouth}" ${S}/><ellipse cx="300" cy="316" rx="17" ry="11" fill="${C.tongue}"/>`;
    case 'pout': return line + `<path d="M285,293 Q300,281 315,293" ${L}/>`;
    case 'o':    return `<ellipse cx="300" cy="296" rx="13" ry="17" fill="${C.mouth}" ${S}/>`;
    case 'wail': return line + `<path d="M268,312 Q300,268 332,312 Q300,326 268,312 Z" fill="${C.mouth}" ${S}/>`;
    case 'zig':  return line + `<path d="M270,294 L285,284 L300,294 L315,284 L330,294" ${L}/>`;
    case 'chew': return line + `<path d="M284,283 Q300,297 316,283" ${L}/>`;
    default:     return line + `<path d="M258,280 Q279,306 300,281 Q321,306 342,280" ${L}/>`;
  }
}

function arm(d, px, py) {
  return `<path d="${d}" fill="none" stroke="${C.o}" stroke-width="46" stroke-linecap="round"/>
          <path d="${d}" fill="none" stroke="${C.furD}" stroke-width="32" stroke-linecap="round"/>
          <circle cx="${px}" cy="${py}" r="14" fill="${C.paw}" stroke="${C.o}" stroke-width="5"/>`;
}
function arms(type) {
  if (type === 'up')   return arm('M178,400 Q112,362 96,292', 96, 288) + arm('M422,400 Q488,362 504,292', 504, 288);
  if (type === 'hold') return '';
  return arm('M176,388 Q150,440 170,480', 170, 484) + arm('M424,388 Q450,440 430,480', 430, 484);
}
function holdLeaf(bitten) {
  return `<path d="M300,500 L300,462" fill="none" stroke="${C.leafD}" stroke-width="8" stroke-linecap="round"/>
    <path d="M300,470 C258,455 258,400 300,372 C342,400 342,455 300,470Z" fill="${C.leaf}" stroke="${C.o}" stroke-width="6" stroke-linejoin="round"/>
    <path d="M300,462 L300,392 M300,440 L282,426 M300,440 L318,426 M300,418 L286,406 M300,418 L314,406" fill="none" stroke="${C.leafD}" stroke-width="4" stroke-linecap="round"/>
    ${bitten ? `<circle cx="331" cy="396" r="17" fill="${C.cream}"/><path d="M316,388 A17,17 0 0 0 338,411" fill="none" stroke="${C.o}" stroke-width="6" stroke-linecap="round"/>` : ''}
    ${arm('M190,398 Q205,470 272,486', 276, 487)}${arm('M410,398 Q395,470 328,486', 324, 487)}`;
}

function extras(type) {
  const heart = (x, y, s) => `<path transform="translate(${x},${y}) scale(${s})" d="M0,16 C-32,-6 -17,-30 0,-12 C17,-30 32,-6 0,16Z" fill="#F0566E" stroke="${C.o}" stroke-width="${4/s}" stroke-linejoin="round"/>`;
  switch (type) {
    case 'hearts': return heart(520, 120, 1.1) + heart(556, 190, 0.6) + heart(70, 150, 0.8);
    case 'anger':  return `<g transform="translate(505,100)" stroke="#E5484D" stroke-width="8" fill="none" stroke-linecap="round">
        <path d="M-20,-7 Q-7,-7 -7,-20"/><path d="M7,-20 Q7,-7 20,-7"/><path d="M20,7 Q7,7 7,20"/><path d="M-7,20 Q-7,7 -20,7"/></g>`;
    case 'shock':  return `<g ${L}><path d="M84,120 L58,96"/><path d="M60,165 L26,156"/><path d="M516,120 L542,96"/><path d="M540,165 L574,156"/></g>`;
    case 'steam':  return `<g fill="#fff" stroke="${C.o}" stroke-width="5"><circle cx="498" cy="322" r="13"/><circle cx="524" cy="304" r="9"/><circle cx="542" cy="290" r="5"/></g>`;
    default: return '';
  }
}
function brows(type) {
  if (type === 'angry') return `<path d="M186,172 L242,192" ${L}/><path d="M414,172 L358,192" ${L}/>`;
  if (type === 'flat')  return `<path d="M190,180 L240,184" ${L}/><path d="M410,180 L360,184" ${L}/>`;
  if (type === 'sad')   return `<path d="M190,190 L238,176" ${L}/><path d="M410,190 L362,176" ${L}/>`;
  return '';
}

function quokka(p) {
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Chubby Quokka ${p.name}">
  <ellipse cx="450" cy="535" rx="46" ry="17" transform="rotate(-25 450 535)" fill="${C.furD}" ${S}/>
  <ellipse cx="300" cy="440" rx="150" ry="135" fill="${C.fur}" ${S}/>
  <ellipse cx="300" cy="455" rx="100" ry="103" fill="${C.cream}"/>
  ${arms(p.arms)}
  <ellipse cx="232" cy="568" rx="50" ry="22" fill="${C.furD}" ${S}/>
  <ellipse cx="368" cy="568" rx="50" ry="22" fill="${C.furD}" ${S}/>
  <circle cx="176" cy="116" r="48" fill="${C.fur}" ${S}/><circle cx="176" cy="118" r="26" fill="${C.ear}"/>
  <circle cx="424" cy="116" r="48" fill="${C.fur}" ${S}/><circle cx="424" cy="118" r="26" fill="${C.ear}"/>
  <ellipse cx="300" cy="230" rx="165" ry="140" fill="${C.fur}" ${S}/>
  <ellipse cx="300" cy="278" rx="88" ry="62" fill="${C.cream}"/>
  <ellipse cx="152" cy="272" rx="27" ry="16" fill="${C.pink}" opacity=".75"/>
  <ellipse cx="448" cy="272" rx="27" ry="16" fill="${C.pink}" opacity=".75"/>
  ${brows(p.brows)}${eye(p.eyes, 215)}${eye(p.eyes, 385)}
  ${mouth(p.mouth)}
  <ellipse cx="300" cy="243" rx="31" ry="21" fill="${C.nose}"/><ellipse cx="290" cy="235" rx="9" ry="5" fill="#fff" opacity=".55"/>
  ${p.arms === 'hold' ? holdLeaf(p.bitten) : ''}
  ${extras(p.extra)}
</svg>`;
}

const POSES = [
  { name:'기본',   eyes:'dot',   mouth:'smile', arms:'down' },
  { name:'말하기', eyes:'dot',   mouth:'open',  arms:'down' },
  { name:'활짝',   eyes:'happy', mouth:'open',  arms:'up' },
  { name:'잎사귀', eyes:'dot',   mouth:'open',  arms:'hold' },
  { name:'냠냠',   eyes:'happy', mouth:'chew',  arms:'hold', bitten:true },
  { name:'하트',   eyes:'heart', mouth:'smile', arms:'down', extra:'hearts' },
  { name:'삐짐',   eyes:'half',  mouth:'pout',  arms:'down', brows:'flat', extra:'steam' },
  { name:'화남',   eyes:'dot',   mouth:'zig',   arms:'down', brows:'angry', extra:'anger' },
  { name:'깜짝',   eyes:'big',   mouth:'o',     arms:'up',   extra:'shock' },
  { name:'엉엉',   eyes:'cry',   mouth:'wail',  arms:'down', brows:'sad' },
];

const PAL = [['털', C.fur], ['털 진한 곳', C.furD], ['배·주둥이', C.cream], ['코·눈', C.nose], ['볼', C.pink], ['귀 안쪽', C.ear], ['외곽선', C.o], ['잎사귀', C.leaf]];

document.getElementById('hero').innerHTML = quokka(POSES[3]);
document.getElementById('pal').innerHTML = PAL.map(([n, c]) => `<div><i style="background:${c}"></i><b>${n}</b>${c}</div>`).join('');
document.getElementById('grid').innerHTML = POSES.map(p => `<figure><div class="stage">${quokka(p)}</div><figcaption>${p.name}</figcaption></figure>`).join('');
</script>
</body>
</html>
